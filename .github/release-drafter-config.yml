# .github/release-drafter-config.yml
# This file configures how your release notes are built.

name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

# Categorize PRs based on their labels
categories:
  - title: "🚀 Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "🐛 Bug Fixes"
    labels:
      - "fix"
      - "bug"
  - title: "🔧 Other Chores"
    labels:
      - "chore"
      - "docs"
      - "refactor"

# Template for the release notes body
template: |
  ## What's Changed
  $CHANGES
