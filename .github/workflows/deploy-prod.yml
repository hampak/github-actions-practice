# .github/workflows/deploy-prod.yml
name: Deploy to Production

on:
  release:
    types: [published] # Triggers ONLY when you publish a release

jobs:
  deploy-prod:
    runs-on: ubuntu-latest

    # Set Vercel env vars for the CLI
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        # This automatically checks out the specific Git tag of the release

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Or your project's Node.js version

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Project Settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project
        # The --prod flag ensures production-specific environment variables are used
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Production
        # The --prod flag aliases this deployment to your production domains
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
